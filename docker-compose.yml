# Environment services. Add your own app service(s) below "# --- your services ---".
services:
  # One-off step: the Case API runs as "nobody" but its state volume belongs to root, so saving a decision crashed it.
  case-api-state-init:
    image: python:3.12-slim
    user: root
    command: ["chown", "65534:65534", "/state"]
    volumes:
      - case-api-state:/state
  case-api:
    build: ./services/case-api
    depends_on:
      case-api-state-init:
        condition: service_completed_successfully
    environment:
      CASE_API_KEY: ${CASE_API_KEY:-local-dev-key-change-me}
      DATA_DIR: /data
      STATE_FILE: /state/decisions.json
    volumes:
      - ./data:/data:ro
      - case-api-state:/state
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      retries: 10
  # --- your services ---
  # Your app must listen on port 8080 and can reach the legacy API at http://case-api:9000
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: queue
      POSTGRES_USER: queue
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-db-password-change-me}
    volumes:
      - queue-db:/var/lib/postgresql/data
    # No published port: the database is reachable only inside this compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue -d queue"]
      interval: 3s
      retries: 20
  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/queue
      SPRING_DATASOURCE_USERNAME: queue
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-local-dev-db-password-change-me}
      INGEST_API_KEY: ${INGEST_API_KEY:-local-dev-ingest-key-change-me}
      APP_NOW: ${APP_NOW:-2026-10-14T08:00:00Z}
      CASE_API_URL: http://case-api:9000
      CASE_API_KEY: ${CASE_API_KEY:-local-dev-key-change-me}
      REFERENCE_DIR: /reference
      # Signs login tokens. No default on purpose: a known key would let anyone forge a login.
      # ./deploy.sh generates a random one into .env (git-ignored) on the first run.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set; run ./deploy.sh or put it in .env}
    # Only the two reference files; the customer export (cases.json) stays out of this container.
    volumes:
      - ./data/reviewers.json:/reference/reviewers.json:ro
      - ./data/reason_codes.json:/reference/reason_codes.json:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  case-api-state:
  queue-db:
