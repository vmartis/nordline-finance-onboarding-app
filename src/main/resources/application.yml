# Database URL, user and password come from the environment
# (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD), never from this file.
spring:
  application:
    name: morning-queue
  mvc:
    # Errors as RFC 9457 problem details; our own messages are written for the reviewer and hold no personal data.
    problemdetails:
      enabled: true
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
app:
  ingest:
    api-key: ${INGEST_API_KEY:}
  clock:
    now: ${APP_NOW:2026-10-14T08:00:00Z}
  case-api:
    url: ${CASE_API_URL:http://case-api:9000}
    key: ${CASE_API_KEY:}
  reference-dir: ${REFERENCE_DIR:/reference}
logging:
  level:
    # Its warnings quote rejected request values, which can be personal data. Clients still get the 400.
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: ERROR
